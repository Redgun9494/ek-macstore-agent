name: Publication automatique EK MacStore

on:
  schedule:
    # Tous les jours à 09h00 UTC (~ 09h00 à Abidjan, GMT+0)
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Permet de lancer le script manuellement depuis l'onglet "Actions" de GitHub,
    # pratique pour tester avant de compter sur le déclenchement automatique.
    inputs:
      dry_run:
        description: "Mode test (n'envoie rien à Facebook/Instagram)"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publier le post du jour
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node publish.js
